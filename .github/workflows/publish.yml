name: Build & Deploy to build branch

on:
  push:
    branches: [main]

permissions:
  contents: write # alleen wat nodig is om naar de build-branch te pushen

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      # --ignore-scripts: install-scripts van packages draaien niet mee.
      # Faalt de build daardoor, haal dan alleen deze vlag weg.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
        env:
          # Vite bakt het API-adres in tijdens het bouwen, dus het moet
          # hier al bekend zijn. In de build-branch staat het er vast in.
          VITE_API_URL: https://schapserv.web4ever.nl
      - uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: build
